<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPS Metrics</title>
    <!-- <link rel="stylesheet" href="https://rsms.me/inter/inter.css"> -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/date-fns@3.6.0/cdn.min.js"></script>

</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">UPS Metrics</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="full_info">Full Information</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-lg">
        <div class="row">
        {% if summary.items()  %}
            <h1 class="mb-4">ups discovery</h1>
            <strong>Found 1 UPS: </strong>
            <div class="mb-3">
                <table class="table w-50">
                    <tr>
                        <td>{{ summary['Manufacturer'] }}</td>
                        <td> {{ summary['Model'] }} </td>
                    </tr>
                    </table>
     
        </div>
        {% else %}
        <h1 class="mb-4">No UPS found</h1>
    {% endif %} 
        <div class="input-group input-group-sm w-50">
            <div class="col-auto">

        <div class="form-text" id="basic-addon4">Show</div>
                </div>

            <select id="keyInput" class="form-select form-select-sm ">
                <option value="battery.charge">Battery Charge</option>
                <option value="battery.runtime">Battery Runtime</option>
                <option value="input.voltage">Input Voltage</option>
                <option value="output.voltage">Output Voltage</option>
            </select>

            <div class="form-text" id="basic-addon4">for the last</div>

            <select id="dateRange" class="form-select form-select-sm" >
                <option selected value="60">60 minutes</option>
                <option value="240">4 hours</option>
                <option value="1440">24 hours</option>
                <option value="10080">7 days</option>
            </select>
        </div>
        </div>
        <div class="row mb-5">
            <canvas id="myChart"></canvas>
        </div>
</div>

<script>
    let myChart;
    async function fetchMetrics(key, range) {
        console.log("Fetching metrics for key: " + key);
        const response = await fetch('/metrics/history?key=' + key + '&range=' + range);
        const data = await response.json();
        //console.log(data);
        return data;
    };
    async function initializeChart() {
        const ctx = document.getElementById('myChart');
        const data = await fetchMetrics('battery.charge', 60);
        myChart = new Chart(ctx, {
            type: 'line',
            data: data,
            options: {
                scales: {
                y: {
                    beginAtZero: true
                }
                }
            }
        });
    }   
   
    async function updateChart() {
        
        key = document.getElementById('keyInput').value
        range = document.getElementById('dateRange').value;
        console.log("Updating chart with key: " + key + " and range: " + range);
        const data = await fetchMetrics(key, range);
        //console.log("Updating chart with data:");
        //console.log(data);
        myChart.data.labels = data.labels;
        myChart.data.datasets[0].data = data.datasets[0].data;
        myChart.data.datasets[0].label = data.datasets[0].label;
        myChart.update();
    }
    initializeChart();
    setInterval(updateChart, 60000);
    document.getElementById('keyInput').addEventListener('change', (event) => {updateChart()});
    document.getElementById('dateRange').addEventListener('change', (event) => {updateChart()});
        
</script>
</body>
</html>
